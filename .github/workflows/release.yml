name: Build Windows Installer

# Bir sürüm etiketi push edildiğinde (örn. v1.0) çalışır ve
# Releases sayfasına tek tıkla kurulabilen .exe yükler.
# Manuel olarak da (Actions sekmesi > Run workflow) çalıştırılabilir.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # Release oluşturup dosya yükleyebilmek için gerekli

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      - name: Determine version
        id: ver
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -match '^v') { $ver = $ref.Substring(1) } else { $ver = "1.0.0" }
          if ($ver -notmatch '^[0-9]+(\.[0-9]+){0,2}$') { $ver = "1.0.0" }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "App version: $ver"

      - name: Build fat jar
        run: mvn -B clean package -DskipTests

      - name: Install WiX Toolset 3.14
        run: |
          $zip = "$env:RUNNER_TEMP\wix.zip"
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\wix" -Force
          "$env:RUNNER_TEMP\wix" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build installer (jpackage)
        run: |
          New-Item -ItemType Directory -Force -Path build-staging | Out-Null
          Copy-Item target/SportsManager.jar build-staging/
          jpackage `
            --type exe `
            --name "Sports Manager" `
            --app-version ${{ steps.ver.outputs.version }} `
            --vendor "Berkay Yorgali" `
            --description "Football and Volleyball manager game" `
            --input build-staging `
            --main-jar SportsManager.jar `
            --main-class sportsmanager.ui.Launcher `
            --add-modules java.base,java.desktop,java.datatransfer,java.xml,java.scripting,java.naming,java.logging,java.management,java.prefs,java.sql,jdk.unsupported,jdk.jsobject,jdk.xml.dom `
            --win-shortcut `
            --win-menu `
            --win-menu-group "Sports Manager" `
            --win-dir-chooser `
            --win-per-user-install `
            --dest dist
          $built = Get-ChildItem dist/*.exe | Select-Object -First 1
          $dest  = "dist/SportsManager-Setup-${{ steps.ver.outputs.version }}.exe"
          Move-Item $built.FullName $dest -Force
          Write-Host "Installer: $dest"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SportsManager-Windows-Installer
          path: dist/*.exe

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Sports Manager ${{ github.ref_name }}
          files: dist/*.exe
          body: |
            ## 🎮 Oynamak için / To play

            1. Aşağıdaki **SportsManager-Setup-*.exe** dosyasını indir.
            2. Çift tıkla ve kurulumu tamamla.
            3. Başlat Menüsü'nden **Sports Manager**'ı aç.

            > Java kurmana gerek yok — her şey pakete dahildir.
            > Windows "bilinmeyen yayıncı" uyarısı verirse: **More info → Run anyway**.
